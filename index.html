<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoftScout</title>
  <meta name="description" content="SoftScout support site - hosted on Cloudflare Pages.">
  <style>
    :root { --bg:#f7f8fa; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --accent:#f38020; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111418; --card:#1a1f26; --text:#e5e7eb; --muted:#9ca3af; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background:var(--bg); color:var(--text); padding:16px; }
    main { background:var(--card); max-width:560px; width:100%; padding:40px 32px;
           border-radius:14px; box-shadow:0 4px 24px rgba(0,0,0,.08); text-align:center; }
    h1 { margin:0 0 8px; font-size:2rem; }
    h1 span { color:var(--accent); }
    p { margin:8px 0; color:var(--muted); line-height:1.5; }
    .badge { display:inline-block; margin-top:20px; padding:6px 14px; border-radius:999px;
             border:1px solid var(--accent); color:var(--accent); font-size:.85rem; }
    footer { margin-top:24px; font-size:.8rem; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Soft<span>Scout</span></h1>
    <p>Welcome to softscout.support.</p>
    <p>This site is deployed from GitHub to Cloudflare Pages.</p>
    <div class="badge">Assignment 0 &middot; Hosting &amp; Pages</div>
    <footer>Version 1.0 &middot; Deployed via Cloudflare Pages</footer>
  </main>
</body>
</html>
